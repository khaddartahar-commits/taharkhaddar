name: Check Arabic Channels

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python check.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add arabic-working.m3u arabic-maghreb.m3u arabic-mashreq.m3u
          git commit -m "تحديث القنوات العربية الشغالة" || echo "ماكاش جديد"
          git push
