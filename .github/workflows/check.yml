name: Fix All

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python fix.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add *.m3u
          git commit -m "إصلاح كل الأكواد" || echo "ماكاش جديد"
          git push
