name: Check All

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python check.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add arabic-working.m3u arabic-maghreb.m3u arabic-mashreq.m3u France.m3u french-working.m3u Italie.m3u italie.m3u Espagne.m3u espagne.m3u Allemagne.m3u allemagne.m3u Angleterre.m3u angleterre.m3u
          git commit -m "تحديث كل الدول" || echo "ماكاش جديد"
          git push
