<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports TV</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>body{background:#111;color:#fff;font-family:Arial;margin:0;text-align:center}header{background:#ED2939;padding:15px}input{width:90%;max-width:500px;padding:12px;border-radius:20px;border:none;margin:15px;text-align:center}video{width:100%;max-height:360px;background:#000}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:15px}.card{background:#1e1e1e;padding:10px;border-radius:10px;cursor:pointer}.card img{width:70px;height:70px;object-fit:contain;background:#fff;border-radius:8px}.card b{display:block;margin-top:8px;font-size:13px}</style>
</head><body>
<header><h1>⚽ Sports - رياضة</h1><p id="status">جاري التحميل من كل الدول...</p></header>
<video id="video" controls playsinline></video><div id="now">اختر قناة ▶</div>
<input id="search" placeholder="🔍 ابحث Bein, SSC, RMC, Sky Sports..."><div id="grid"></div>
<center><a href="index.html" style="color:#fff">⬅ الرئيسية</a></center>
<script>
let all=[];
async function loadFile(file){try{let r=await fetch(file);let t=await r.text();let lines=t.split('\n');let info='';for(let l of lines){l=l.trim();if(l.startsWith('#EXTINF'))info=l;else if(l.startsWith('http')){let name=(info.split(',')[1]||'Ch').trim();let low=name.toLowerCase();if(low.includes('bein')||low.includes('ssc')||low.includes('sport')||low.includes('rmc')||low.includes('dazn')||low.includes('espn')||low.includes('lequipe')||low.includes('canal+ sport')||low.includes('eurosport')||low.includes('bein')){let logo=(info.match(/tvg-logo="([^"]+)"/)||[])[1]||'';all.push({name,logo,url:l});}info='';}}}catch(e){}}
async function load(){await loadFile('arabic-working.m3u');await loadFile('France.m3u');await loadFile('Espagne.m3u');await loadFile('Italie.m3u');await loadFile('Allemagne.m3u');await loadFile('Angleterre.m3u');await loadFile('Portugal.m3u');await loadFile('Hollande.m3u');document.getElementById('status').textContent='✅ '+all.length+' قناة رياضة شغالة';render();}
function render(){let q=document.getElementById('search').value.toLowerCase();let f=all.filter(c=>c.name.toLowerCase().includes(q));document.getElementById('grid').innerHTML=f.map(c=>`<div class="card" onclick="play(${all.indexOf(c)})"><img src="${c.logo||'https://via.placeholder.com/70?text=SPORT'}" onerror="this.src='https://via.placeholder.com/70?text=SPORT'"><b>${c.name}</b></div>`).join('');}
function play(i){let c=all[i];let v=document.getElementById('video');document.getElementById('now').textContent='▶ '+c.name;if(Hls.isSupported()&&c.url.includes('.m3u8')){let h=new Hls();h.loadSource(c.url);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>v.play());}else{v.src=c.url;v.play();}window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('search').addEventListener('input',render);load();
</script></body></html>
