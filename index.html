<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAHAR KHADDAR IPTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#0f0f0f;color:#fff}
header{background:#111;padding:15px;text-align:center;border-bottom:2px solid #00c853}
header h1{margin:0;color:#00c853;font-size:24px}
header p{margin:5px 0 0;color:#aaa;font-size:13px}
.container{max-width:1100px;margin:auto;padding:12px}
.box{background:#1a1a1a;padding:15px;border-radius:12px;margin-bottom:12px}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#222;color:#fff;font-size:15px}
button{background:#00c853;border:none;font-weight:bold;cursor:pointer;color:#000}
button.sec{background:#333;color:#fff}
.flex{display:flex;gap:10px}.flex>*{flex:1}
video{width:100%;background:#000;border-radius:12px;max-height:480px}
#nowPlaying{font-weight:bold;margin:10px 0;text-align:center}
.catBtn{padding:8px 14px;border-radius:20px;background:#222;border:1px solid #333;color:#fff;cursor:pointer;white-space:nowrap}
.catBtn.active{background:#00c853;color:#000}
#cats{display:flex;gap:8px;overflow-x:auto;padding:5px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.ch{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:10px;padding:10px;cursor:pointer;text-align:center}
.ch:hover{border-color:#00c853}
.ch img{width:55px;height:55px;object-fit:contain;background:#fff;border-radius:8px}
.ch b{display:block;margin-top:8px;font-size:13px;line-height:1.3;min-height:34px}
.ch span{font-size:11px;color:#ffb300}
</style>
</head>
<body>
<header>
<h1>📺 TAHAR KHADDAR IPTV</h1>
<p>كل القنوات العربية المجانية - في رابط واحد</p>
</header>
<div class="container">
<div class="box">
<div id="nowPlaying">اختر قناة للمشاهدة</div>
<video id="video" controls playsinline></video>
<div class="flex">
<button class="sec" onclick="toggleFav()">⭐ مفضلة</button>
<button class="sec" onclick="stopPlayer()">⏹ إيقاف</button>
</div>
</div>
<div class="box">
<div class="flex">
<input id="search" placeholder="🔍 ابحث على قناة..." oninput="render()">
<button style="width:130px" onclick="showFavsOnly=!showFavsOnly;render()">⭐ مفضلتي</button>
</div>
<div id="cats"></div>
<div id="count" style="font-size:12px;color:#aaa"></div>
<div class="grid" id="grid"></div>
<p style="font-size:12px;color:#888;text-align:center">رابط M3U تاع المشروع:<br>https://khaddartahar-commits.github.io/taharkhaddar/arabic.m3u</p>
</div>
</div>
<script>
let channels=[], currentCat='الكل', currentCh=null, showFavsOnly=false;
let favs = JSON.parse(localStorage.getItem('taharkhaddar_favs')||'[]');
let hls=null;
const M3U_URL = 'https://khaddartahar-commits.github.io/taharkhaddar/arabic.m3u';
function parseM3U(text){
 let lines=text.split('\n'), list=[], cur={};
 lines.forEach(line=>{
  line=line.trim();
  if(line.startsWith('#EXTINF')){
   let name=line.split(',').pop()||'قناة';
   let logo=(line.match(/tvg-logo="([^"]*)"/)||[])[1]||'';
   let group=(line.match(/group-title="([^"]*)"/)||[])[1]||'عام';
   cur={name,logo,group};
  } else if(line && !line.startsWith('#') && cur.name){
   cur.url=line; list.push(cur); cur={};
  }
 });
 return list;
}
async function load(){
 try{
  let r=await fetch(M3U_URL);
  let t=await r.text();
  channels=parseM3U(t);
  render();
 }catch(e){ document.getElementById('count').textContent='خطأ في تحميل القنوات - جرب بعد دقيقة'; }
}
function getCats(){ let s=new Set(['الكل']); channels.forEach(c=>s.add(c.group)); return [...s]; }
function render(){
 let q=(document.getElementById('search').value||'').toLowerCase();
 let cats=getCats();
 document.getElementById('cats').innerHTML=cats.map(c=>`<button class="catBtn ${c===currentCat?'active':''}" onclick="currentCat='${c.replace(/'/g,"")}';render()">${c}</button>`).join('');
 let list=channels.filter(c=>(currentCat==='الكل'||c.group===currentCat) && c.name.toLowerCase().includes(q));
 if(showFavsOnly) list=list.filter(c=>favs.includes(c.url));
 document.getElementById('count').textContent=`عدد القنوات: ${list.length} / ${channels.length}`;
 document.getElementById('grid').innerHTML=list.map((c,i)=>{
  let idx=channels.indexOf(c);
  return `<div class="ch" onclick="play(${idx})"><img src="${c.logo||'https://cdn-icons-png.flaticon.com/512/726/726521.png'}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/726/726521.png'"><b>${c.name}</b><span>${c.group} ${favs.includes(c.url)?'⭐':''}</span></div>`
 }).join('') || '<p>لا توجد نتائج</p>';
}
function play(idx){
 currentCh=channels[idx];
 document.getElementById('nowPlaying').textContent='▶ '+currentCh.name;
 let v=document.getElementById('video');
 if(hls){ hls.destroy(); hls=null; }
 if(Hls.isSupported() && currentCh.url.includes('.m3u8')){
  hls=new Hls(); hls.loadSource(currentCh.url); hls.attachMedia(v); hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play());
 } else { v.src=currentCh.url; v.play(); }
 render();
}
function toggleFav(){
 if(!currentCh) return;
 if(favs.includes(currentCh.url)) favs=favs.filter(x=>x!==currentCh.url);
 else favs.push(currentCh.url);
 localStorage.setItem('taharkhaddar_favs',JSON.stringify(favs));
 render();
}
function stopPlayer(){ let v=document.getElementById('video'); v.pause(); v.src=''; if(hls){hls.destroy();hls=null;} }
load();
</script>
</body>
</html>
