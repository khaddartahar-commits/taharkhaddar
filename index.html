<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>قنوات عربية</title>
<style>
body{background:#111;color:#fff;font-family:Arial;text-align:center;padding:20px}
button{padding:10px 18px;border:0;border-radius:20px;margin:5px;cursor:pointer;background:#222;color:#fff}
button.active{background:#22c55e;color:#000;font-weight:bold}
.card{background:#1e1e1e;padding:12px;margin:8px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
a{color:#22c55e;text-decoration:none;font-weight:bold}
input{width:90%;padding:10px;border-radius:10px;border:0;margin:10px 0}
</style></head>
<body>
<h2>📺 قنوات عربية شغالة</h2>
<p id="count">جاري التحميل...</p>
<input id="search" placeholder="🔍 ابحث عن قناة..." oninput="render()">
<div id="filters"></div>
<div id="list"></div>
<script>
let all=[], groups=new Set(), cur='الكل';
fetch('arabic.m3u').then(r=>r.text()).then(t=>{
  let lines=t.split('\n'), ch=null;
  for(let i=0;i<lines.length;i++){
    if(lines[i].startsWith('#EXTINF')){
      let g=(lines[i].match(/group-title="([^"]*)"/)||[])[1]||'عام';
      let name=lines[i].split(',').pop();
      ch={name:name,group:g};
    } else if(lines[i].startsWith('http') && ch){ ch.url=lines[i].trim(); all.push(ch); groups.add(ch.group); ch=null; }
  }
  document.getElementById('count').innerText=`عدد القنوات الشغالة: ${all.length} / ${all.length} - آخر فحص كل ساعة`;
  let f=document.getElementById('filters');
  f.innerHTML=`<button class="active" onclick="setG('الكل',this)">الكل</button>`+[...groups].map(g=>`<button onclick="setG('${g}',this)">${g}</button>`).join('');
  render();
});
function setG(g,btn){cur=g;document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function render(){
  let q=document.getElementById('search').value.toLowerCase();
  let list=all.filter(c=>(cur=='الكل'||c.group==cur)&&c.name.toLowerCase().includes(q));
  document.getElementById('list').innerHTML=list.map(c=>`<div class="card"><span>${c.name}<br><small>✅ ${c.group}</small></span><a href="${c.url}" target="_blank">شاهد</a></div>`).join('');
}
</script></body></html>
