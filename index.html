<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAHAR KHADDAR IPTV</title>
<style>
*{box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Arial;margin:0;padding:0}
/* مربع الفيديو الثابت - يبقى لاصق فوق */
.playerBox{position:sticky;top:0;z-index:100;background:#000;padding:10px;border-bottom:2px solid #22c55e}
.playerBox h3{margin:5px 0;font-size:15px;text-align:center}
video{width:100%;max-height:280px;background:#000;border-radius:12px;display:block}
.now{font-size:13px;color:#4ade80;text-align:center;margin-top:5px}
.quality{text-align:center;margin-top:6px}
.quality button{padding:6px 12px;border:0;border-radius:20px;margin:2px;background:#222;color:#fff;cursor:pointer;font-size:12px}
.quality button.active{background:#22c55e;color:#000;font-weight:bold}
.wrap{padding:12px}
.search{width:100%;padding:12px;border-radius:12px;border:0;background:#1e1e1e;color:#fff;margin:10px 0}
/* أسماء الملفات - عربي فرنسي ايطالي */
.files{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px}
.files button{white-space:nowrap;padding:10px 18px;border-radius:20px;border:0;background:#1e1e1e;color:#fff;cursor:pointer;font-weight:bold;font-size:14px}
.files button.active{background:#22c55e;color:#000}
.files button span{font-size:12px;display:block;font-weight:normal}
.count{font-size:13px;color:#aaa;text-align:center;margin:8px 0}
.progress{background:#222;height:8px;border-radius:10px;overflow:hidden;margin:8px 0}
.progress div{background:#22c55e;height:100%;width:0%}
.card{background:#1e1e1e;padding:12px;margin:8px 0;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.card b{font-size:15px}
.card small{color:#4ade80}
.card a{color:#22c55e;text-decoration:none;font-weight:bold;background:#111;padding:8px 14px;border-radius:20px}
.m3uBox{background:#1e1e1e;padding:12px;border-radius:12px;margin:10px 0;text-align:center}
.m3uBox input{width:100%;background:#111;color:#4ade80;border:0;padding:8px;border-radius:8px;text-align:left;direction:ltr;font-size:12px}
.copyBtn{background:#22c55e !important;color:#000 !important;font-weight:bold;padding:10px 18px;border:0;border-radius:20px;margin-top:8px;cursor:pointer;width:100%}
</style>
</head>
<body>

<!-- 1. مربع الفيديو الثابت -->
<div class="playerBox">
  <h3>📺 TAHAR KHADDAR IPTV</h3>
  <video id="player" controls playsinline preload="none" poster="https://via.placeholder.com/800x450/111/22c55e?text=TAHAR+KHADDAR+IPTV"></video>
  <div class="now" id="nowPlaying">اختر قناة من التحت 👇 - الفيديو يبقى ثابت هنا</div>
  <div class="quality">
    <button onclick="setQuality('low',this)" class="active">💚 توفير 360p</button>
    <button onclick="setQuality('mid',this)">480p</button>
    <button onclick="setQuality('high',this)">720p</button>
    <button onclick="setQuality('full',this)">🔥 1080p</button>
  </div>
</div>

<div class="wrap">
  <!-- 2. أسماء الملفات -->
  <div class="files" id="files">
    <button class="active" onclick="loadFile('arabic-maghreb','🇸🇦 عربي - مغرب',this)">🇸🇦 عربي<span>مغرب كبير</span></button>
    <button onclick="loadFile('arabic-mashreq','🇸🇦 عربي - مشرق',this)">🇸🇦 عربي<span>مشرق</span></button>
    <button onclick="loadFile('french','🇫🇷 فرنسي',this)">🇫🇷 فرنسي<span>FRANÇAIS</span></button>
    <button onclick="loadFile('italian','🇮🇹 إيطالي',this)">🇮🇹 إيطالي<span>ITALIANO</span></button>
    <button onclick="loadFile('spanish','🇪🇸 إسباني',this)">🇪🇸 إسباني<span>ESPAÑOL</span></button>
    <button onclick="loadFile('english','🇬🇧 إنجليزي',this)">🇬🇧 إنجليزي<span>ENGLISH</span></button>
    <button onclick="loadFile('turkish','🇹🇷 تركي',this)">🇹🇷 تركي<span>TÜRKÇE</span></button>
    <button onclick="loadFile('sports','⚽ رياضة',this)">⚽ رياضة<span>SPORT</span></button>
  </div>

  <div class="m3uBox">
    <small>رابط M3U للتلفاز - تاع الملف المختار:</small>
    <input id="m3uLink" readonly value="">
    <button class="copyBtn" onclick="copyLink()">📋 نسخ رابط M3U للتلفاز</button>
  </div>

  <input class="search" id="search" placeholder="🔍 ابحث عن قناة..." oninput="render()">
  <div class="count" id="count">جاري التحميل...</div>
  <div class="progress"><div id="bar"></div></div>
  <div id="list"></div>
</div>

<script>
let all=[], working=[], curFile='arabic-maghreb', curName='🇸🇦 عربي - مغرب';
let quality='low', currentUrl='';
const cdns=[
  "https://cdn.jsdelivr.net/gh/khaddartahar-commits/taharkhaddar@main/",
  "https://fastly.jsdelivr.net/gh/khaddartahar-commits/taharkhaddar@main/",
  "https://gcore.jsdelivr.net/gh/khaddartahar-commits/taharkhaddar@main/",
  "https://cdn.statically.io/gh/khaddartahar-commits/taharkhaddar/main/",
  "https://khaddartahar-commits.github.io/taharkhaddar/"
];
async function fetchOne(url){
  try{ let r=await fetch(url,{cache:"no-cache"}); let t=await r.text(); if(r.ok && t.includes("#EXTM3U")) return t; }catch(e){}
  return "";
}
async function loadFile(file, name, btn){
  curFile=file; curName=name;
  document.querySelectorAll('#files button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('count').innerText='جاري جلب '+name+'...';
  document.getElementById('list').innerHTML='';
  document.getElementById('bar').style.width='0%';
  document.getElementById('m3uLink').value = cdns[0]+file+'.m3u';
  let text="";
  for(let base of cdns){
    text=await fetchOne(base+file+'.m3u');
    if(text) break;
  }
  if(!text){
    // اذا الملف مازال ما كاينش - مثلا فرنسي - نعرضو رسالة
    document.getElementById('count').innerText='⏳ ملف '+name+' مازال ما وجدش - اختر العربي دوكا';
    document.getElementById('list').innerHTML='<div class="card"><b>⏳ '+name+' قريبا</b><small>اختر عربي مغرب / مشرق دوكا</small></div>';
    return;
  }
  parseM3U(text);
  checkWorking();
}
function parseM3U(t){
  let lines=t.split('\n'), ch=null;
  all=[]; working=[];
  for(let i=0;i<lines.length;i++){
    if(lines[i].startsWith('#EXTINF')){
      let g=(lines[i].match(/group-title="([^"]*)"/)||[])[1]||'عام';
      let name=lines[i].split(',').pop();
      ch={name:name,group:g};
    } else if(lines[i].startsWith('http') && ch){
      ch.url=lines[i].trim(); all.push(ch); ch=null;
    }
  }
  document.getElementById('count').innerText=`لقينا ${all.length} قناة في ${curName} - نفحصو و نعرضو غير الشغالة...`;
}
async function checkWorking(){
  working=[];
  let batch=20;
  for(let i=0;i<all.length;i+=batch){
    let chunk=all.slice(i,i+batch);
    let res=await Promise.all(chunk.map(c=>testVideo(c.url).then(ok=>ok?c:null)));
    res.forEach(c=>{ if(c) working.push(c); });
    let pct=Math.min(100,Math.round((i+batch)/all.length*100));
    document.getElementById('bar').style.width=pct+'%';
    document.getElementById('count').innerText=`فحصنا ${Math.min(i+batch,all.length)} / ${all.length} - لقينا ${working.length} شغالة ✅ في ${curName}`;
    render();
  }
  document.getElementById('count').innerText=`✅ ${curName} - نعرضو غير ${working.length} شغالة من أصل ${all.length}`;
}
function testVideo(url){
  return new Promise(res=>{
    let v=document.createElement('video'); v.muted=true; v.preload='auto'; v.src=url;
    let done=false;
    let to=setTimeout(()=>{ if(!done){done=true; res(false);} }, 5000);
    v.oncanplay=()=>{ if(!done){done=true; clearTimeout(to); res(true);} };
    v.onprogress=()=>{ if(!done && v.readyState>0){done=true; clearTimeout(to); res(true);} };
    v.onerror=()=>{ if(!done){done=true; clearTimeout(to); res(true);} };
  });
}
function render(){
  let q=document.getElementById('search').value.toLowerCase();
  let list=working.filter(c=>c.name.toLowerCase().includes(q));
  if(working.length==0 && all.length>0){
    document.getElementById('list').innerHTML='<p style="text-align:center">⏳ جاري فحص القنوات... يبانو غير الشغالة هنا...</p>';
    return;
  }
  document.getElementById('list').innerHTML=list.map(c=>`<div class="card"><span><b>${c.name}</b><br><small>✅ ${c.group}</small></span><a href="javascript:void(0)" onclick="playChannel('${c.url}','${c.name.replace(/'/g,"")}')">▶ شاهد</a></div>`).join('');
}
function setQuality(q,btn){
  quality=q;
  document.querySelectorAll('.quality button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(currentUrl) playChannel(currentUrl, document.getElementById('nowPlaying').innerText);
}
function getQualityUrl(url){
  let m={low:'360',mid:'480',high:'720',full:'1080'};
  if(url.match(/\/\d{3,4}\//)) return url.replace(/\/\d{3,4}\//,'/'+m[quality]+'/');
  return url;
}
function playChannel(url,name){
  currentUrl=url;
  let v=document.getElementById('player');
  v.src=getQualityUrl(url);
  v.play();
  document.getElementById('nowPlaying').innerText='▶ تشاهد الآن: '+name;
  window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('visibilitychange',()=>{ let v=document.getElementById('player'); if(document.hidden) v.pause(); });
function copyLink(){
  const i=document.getElementById("m3uLink"); i.select(); navigator.clipboard.writeText(i.value); alert("تم النسخ ✅ - "+curName);
}
loadFile('arabic-maghreb','🇸🇦 عربي - مغرب', document.querySelector('#files button'));
</script>
</body>
</html>
